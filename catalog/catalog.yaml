      - plaud-cli
      - plaud
      - prm
      - prc
      - merge
      - fontfreeze
      - perfrig
      - shrt
      - press
      - press-pdf
      - press-logo
      - press-offer
      - press-email
      - ingressgen
      - cli-craft

  - id: press-family
    description: Document production — the press CLI plus the PDF, logo, and offer skills that drive it.
    items:
      - press
      - press-pdf
      - press-logo
      - press-offer
      - press-email

  - id: ai-git
    description: Reusable pull-request creation, review, and merge workflows.
    items:
      - prm
      - prc
      - merge

  - id: everything
    description: Every package currently published by Výbava.
