schema_version: 1

items:
  - id: worktime
    kind: applet
    status: experimental
    description: Native metadata-only foreground application and idle sampling for opt-in automatic time capture.
    applet: worktime

  - id: menubar-doctor
    kind: applet
    status: experimental
    description: Find and fix macOS menu-bar items that run but never appear — Control Center files a status item under the process that launched the app, so anything started from a terminal is filed under the terminal and stays invisible while its switch is off.
    applet: menubar-doctor

  - id: claude-guards
    kind: applet
    status: experimental
    description: PreToolUse guard hooks for Claude Code — block destructive git/docker calls, secret and environment dumps, host-input automation, commit-time secrets, whole-disk find/bfs/fd walks, per-look Appium sessions, uncapped local playwright/vitest/jest runs, and the context-budget sinks (shell-rewritten files, whole-file dumps, transcript reads); every block names the sanctioned alternative.
    applet: claude-guards

  - id: lok
    kind: applet
    status: experimental
    description: Locale catalogs for AI sessions — never read whole. Configured in vybava.config.ts (lok.catalogs), queried by key (get, grep, missing), written by verb with every locale kept in sync (add, set, rm), extracted from source (scan), gated in CI (check).
    applet: lok

  - id: merge-assist
    kind: applet
    status: experimental
    description: Merge main without the mechanical conflicts — locale catalogs merge by key (lok driver), generated files take theirs and regenerate, unmerged migrations renumber past the base; one verb prints what is left as a compact table. Configured in vybava.config.ts (merge + lok).
    applet: merge-assist

  - id: posta
    kind: applet
    status: experimental
    description: Drive a shared test mailbox end to end — mint a per-run plus-address, wait for the message a journey triggered, take its links and attachments, send and purge; the app password is injected from the vault and never printed.
    applet: posta

  - id: envbridge
    kind: applet
    status: experimental
    description: Transfer named environment values through a private, expiring Unix socket without secret-bearing files; read output stays inside the consuming process.
    applet: envbridge

  - id: operator
    kind: applet
    status: experimental
    description: Observe new Claude Code activity, queue attention into a Codex thread, and record human-scored WhatsApp or code-feedback proposals; sending stays human-only.
    applet: operator

  - id: memorylint
    kind: applet
    status: stable
    description: Validate and maintain Obsidian-compatible AI memory files — schema, indexes, links, limits, fixture data, external references, and agent write hooks.
    applet: memorylint

  - id: memo
    kind: applet
    status: experimental
    description: Append-only memory ledger for AI sessions - LEDGER.md rows with stable ids, MEMORY.md rendered by usage score, citations harvested from the session transcript, Obsidian vault and local git snapshots.
    applet: memo

  - id: fontfreeze
    kind: applet
    status: experimental
    description: Freeze variable webfonts at the axis positions a site renders and subset them per language, via fonttools.
    applet: fontfreeze

  - id: perfrig
    kind: applet
    status: experimental
    description: Orchestrate a performance drill from a testing/<project>/perf manifest — neighbor guard, staged push-to-first-failure ramp, and percentile-vs-concurrency report; projects supply seed/auth/generator commands.
    applet: perfrig

  - id: shrt
    kind: applet
    status: experimental
    description: Shorten URLs into terminal-safe luko.to links that never wrap or truncate on click in narrow panes; also runs the redirector server.
    applet: shrt

  - id: press
    kind: applet
    status: experimental
    description: Deterministic state for the press document family — resolve a project, keep ~/Exports/<project>/ config and index honest, look up Czech companies in ARES, and serve the family's shared doctrine.
    applet: press

  - id: ingressgen
    kind: applet
    status: experimental
    description: Render and drift-check complete default-deny DOCKER-USER iptables policies from project-owned manifests.
    applet: ingressgen

  - id: codexsync
    kind: applet
    status: experimental
    description: Render ~/.claude skills and commands into ~/.agents/skills, the structure Codex actually discovers — nesting preserved, each command a source-command skill, duplicate discovery suppressed in config.toml.
    applet: codexsync

  - id: codexusage
    kind: applet
    status: experimental
    description: Explain where the Codex plan limit went — per-thread spend from ~/.codex rollouts, the derived allowance, and the runway left at the measured burn rate.
    applet: codexusage

  - id: tokentime
    kind: applet
    status: experimental
    description: Where your AI tokens went — Claude Code transcripts and Codex rollouts indexed incrementally into permanent hour × project × model buckets (worktrees fold into their repo), rolled up by day, hour, project and model with an API-equivalent USD value.
    applet: tokentime

  - id: repolicy
    kind: applet
    status: experimental
    description: Hold GitHub repository settings to a declared policy across whole owners — GitHub inherits no organization default, so audit reports the drift (exit 1) and apply converges it, touching only the settings the policy names.
    applet: repolicy

  - id: reconcile
    kind: applet
    status: experimental
    description: Pull-based GitOps engine for the infra boxes — converge a VPS to its infra repo's merged main from a per-box manifest, with HELD hotfix detection, transactional nginx hooks, git-commit rollback, textfile metrics and a mesh-only status page.
    applet: reconcile

  - id: hotfix
    kind: applet
    status: experimental
    description: Release-lineage hotfix lane for trunk-based repos — cut a branch from the tag production runs in an isolated worktree, open the PR that is both CI gate and forward-port, deploy production FROM the branch, merge once shipped; state re-derived from git + gh, every verb idempotent with a JSON envelope.
    applet: hotfix

  - id: reclaim
    kind: applet
    status: experimental
    description: Emergency disk reclaim for a dev Mac — a fixed ladder of regenerating caches deleted biggest-first with live df after every step, an early-stop target, and by-hand notes for what it refuses to touch (volumes, recordings).
    applet: reclaim

  - id: macwatch
    kind: applet
    status: experimental
    description: Mac load sampler with owner attribution - append load, memory and the heaviest processes to a TSV every interval, each tagged with project, directory and the claude/codex session that spawned it; report integrates the file into offenders, per-project and per-session totals and a spike ledger (text, Markdown, JSON).
    applet: macwatch

  - id: plugin-gc
    kind: applet
    status: experimental
    description: Garbage-collect the Claude Code plugin cache — every installed version is kept forever behind a PID refcount that abandoned sessions never release, and the payload is almost all node_modules; reports by default and only on --apply sweeps dead markers, strips node_modules from inactive versions and removes the versions nothing holds.
    applet: plugin-gc

  - id: skipci
    kind: applet
    status: experimental
    description: Hold a repo's pull_request workflows to the org skip-ci standard — every job carries the job-level `skip-ci` label guard (a labelled PR runs nothing, its checks read as skipped); check reports guarded/missing/wrap/manual per job, apply inserts and AND-wraps by line edits and never touches a multi-line condition. The labels themselves are repolicy's default policy; prm --admin applies them.
    applet: skipci

  - id: handoffs
    kind: applet
    status: experimental
    description: Handoff ledger upkeep — `handoffs reconcile` judges every open handoff by whether its branches and PRs are still alive (git, no fetch; gh) and archives the dead ones as abandoned; unknown is never touched, nothing is deleted.
    applet: handoffs

  - id: plaud-cli
    kind: applet
    status: experimental
    description: Read Plaud recordings, AI notes and transcripts straight from the Plaud developer API — PKCE login, vault-injected refresh token, only the short-lived access token cached; no MCP server process.
    applet: plaud

  - id: plaud
    kind: skill
    status: experimental
    description: Manual-only doctrine for the plaud applet — onyx token injection and capture flow, the commands, landing a recording in a codebase, and the untrusted-transcript rule.
    source: skills/plaud

  - id: prm
    kind: skill
    status: experimental
    description: The one PR verb — create or adopt the branch PR, work review rounds inline, gate and merge, then tear down.
    source: skills/prm

  - id: push-all
    kind: skill
    status: experimental
    description: Commit doctrine — full-tree sweep by default, surgical single change set on request, never fires unasked.
    source: skills/push-all

  - id: sync
    kind: skill
    status: experimental
    description: Bring a checkout up to date — default branch pulls ff-only; feature branch merges the default branch, then deps, backup+migrate, regen, verify.
    source: skills/sync

  - id: push-back
    kind: skill
    status: experimental
    description: Verify a claim against code, docs and project rules before acting on it; prm composes it for every review verdict.
    source: skills/push-back

  - id: gitkit
    kind: applet
    status: experimental
    description: Deterministic git/PR layer the prm, push-all and sync skills execute — PR selectors, review triage, merge gates, worktrees, path classification.
    applet: gitkit

  - id: cli-craft
    kind: skill
    status: experimental
    description: Doctrine for building AI-first CLI tools and their thin-wrapper skills — envelope contract, closed diagnostics, Go/Charm patterns.
    source: skills/cli-craft

  - id: memo-ledger
    kind: skill
    status: experimental
    description: Thin wrapper skill for the memo applet - capture a row, cite it as #NN, look it up; the hard laws (never hand-edit LEDGER.md, supersede instead of correcting).
    source: skills/memo-ledger

  - id: hotfix-lane
    kind: skill
    status: experimental
    description: Thin wrapper skill for the hotfix applet — the ordered verbs and the hard laws (never merge main into a hotfix branch, deploy only from the branch).
    source: skills/hotfix-lane

  - id: readiness
    kind: applet
    status: experimental
    description: Deterministic layer of the release-readiness skill — validates the vybava.config.ts readiness section, freezes each repo's production..integration range, seeds a run directory with scripts and ledgers, and renders lane rules, lane bodies and agent briefs from the run's manifests (drift-checked).
    applet: readiness

  - id: release-readiness
    kind: skill
    status: experimental
    description: Multi-lane release prep of a whole integration branch — authority questions, inventory with a completeness critic, one lane agent per journey cluster with its own usertest board, capacity governance, merged-branch roll-up and a readiness board.
    source: skills/release-readiness

  - id: press-pdf
    kind: skill
    status: experimental
    description: Build offer, documentation, and legal PDFs from a per-project config — themed, linted, and byte-reproducible.
    source: skills/press-pdf

  - id: press-logo
    kind: skill
    status: experimental
    description: Logo, brand mark, and favicon creation — decision-led brainstorm to SVG takes on a local preview, then a standardized brand package.
    source: skills/press-logo

  - id: press-offer
    kind: skill
    status: experimental
    description: Czech commercial offer documents (cenova nabidka, functional specification, impact analysis) as editable DOCX in the issuer's house style.
    source: skills/press-offer

  - id: press-email
    kind: skill
    status: experimental
    description: Client and prospect emails as one Outlook-paste HTML per project — inline-styled house markup, project fact sheet, browser-verified links.
    source: skills/press-email

  # Tools: external apps and CLIs installed through their product's own
  # published channel and probed live (internal/toolsetup, docs/setup-team.md).
  - id: node
    kind: tool
    status: stable
    description: Node.js — runs the gitkit layer (22.18+ strips TypeScript natively).
    tool:
      probe: {command: node}
      install: {brew: node}

  - id: bun
    kind: tool
    status: stable
    description: Bun — the runtime behind bunx-delivered installers (onyx-mcp).
    tool:
      probe: {command: bun}
      install: {brew: oven-sh/bun/bun}

  - id: helium
    kind: tool
    status: experimental
    description: Helium browser — the Chromium the Onyx extension and the agents' browser sessions run in.
    tool:
      probe: {app: Helium.app}
      install: {brew_cask: helium-browser}

  - id: onyx
    kind: tool
    status: experimental
    description: Onyx vault app — encrypted secrets the agents reference by handle, never by value.
    tool:
      probe: {app: Onyx.app}
      install: {pultik: onyx}

  - id: onyx-mcp
    kind: tool
    status: experimental
    description: Onyx MCP server as a resident LaunchAgent, registered with Claude Code and Codex — guided onboarding.
    tool:
      probe: {path: ~/Library/LaunchAgents/com.lovinka.onyx-mcp.plist}
      install: {run: [bunx, "@lovinka/onyx-mcp", setup]}
      needs: [bun, onyx]
      interactive: true

  - id: onyx-extension
    kind: tool
    status: experimental
    description: Onyx browser extension + native bridge in Helium — autofill, save-on-submit, TOTP.
    tool:
      probe: {path: "~/Library/Application Support/net.imput.helium/NativeMessagingHosts/com.lovinka.onyx.json"}
      install: {run: [bash, -c, "curl -fsSL https://onyx.lovinka.com/downloads/install-extension.sh | bash"]}
      needs: [helium, onyx]
      interactive: true

  - id: onyx-mcp-browsers
    kind: tool
    status: experimental
    description: Lazy Playwright + chrome-devtools MCP through the Onyx bridge — no browser spawns until an agent uses one, and each session attaches to its own onyx browser.
    tool:
      probe: {path: ~/.local/share/onyx-bridge/bin/mcp-lazy}
      install: {run: [bash, -c, "curl -fsSL https://onyx.lovinka.com/downloads/install-extension.sh | bash -s -- --mcp-browsers"]}
      needs: [onyx-extension, node]

  - id: vitrinka-cli
    kind: tool
    status: experimental
    description: The vitrinka CLI — boards, tasks and artifact publishing; setup signs in and wires the Claude plugin and MCP.
    tool:
      probe: {command: vitrinka}
      install: {pultik: "vitrinka-cli-darwin-{arch}"}
      setup: [[vitrinka, setup]]

  - id: vitrinka-app
    kind: tool
    status: experimental
    description: Vitrinka desktop shell — instant summon and vitrinka:// deep links.
    tool:
      probe: {app: Vitrinka.app}
      install: {pultik: vitrinka}

  - id: switcheroo-bar
    kind: tool
    status: experimental
    description: SwitcherooBar — Claude account switcher and usage cockpit in the menu bar.
    tool:
      probe: {app: SwitcherooBar.app}
      install: {pultik: switcheroo}

  - id: switcheroo-cli
    kind: tool
    status: experimental
    description: switcheroo CLI — Claude/Codex account switching and the cc/cco/ccl/cch/cx shell functions; setup writes the zshrc block, then signs in.
    tool:
      probe: {command: switcheroo}
      install: {pultik: "switcheroo-cli-darwin-{arch}"}
      setup: [[switcheroo, shell, install], [switcheroo, setup]]

  - id: pultik
    kind: tool
    status: experimental
    description: Pultík — menu-bar command center for CI, PRs and widgets (⌥Space).
    tool:
      probe: {app: Pultik.app}
      install: {pultik: pultik}

  - id: devbox
    kind: tool
    status: experimental
    description: Devbox CLI — remote dev workspaces on Devulinka. Owner-only for now; needs henderson-tech repo access.
    tool:
      probe: {command: devbox}
      install: {run: [bash, -c, "d=\"$HOME/Work/Projects/FixIt-Technologies/devbox\"; [ -d \"$d\" ] || gh repo clone henderson-tech/devbox \"$d\"; \"$d/mac/setup.sh\""]}
      optional: true
      interactive: true

