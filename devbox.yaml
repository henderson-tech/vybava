project: vybava

resources:
  memory: 3G

apps:
  repo:
    # Devbox requires a named port even for a CLI-only test workspace.
    ports: [repo]
    cmd: sleep infinity
    sync: .
    sync_ignores: [".env", ".env.*", "dist", "coverage.out", "/vybava", "/bin"]

scripts:
  test: go test -race ./...
  # Every mod through the engine's own checks (docs/mods.md); plugin test
  # needs the hooks switch set for its own process.
  mods: 'for m in mods/*/; do claude plugin validate --strict "$m" && CLAUDE_CODE_ENABLE_FUNCTION_HOOKS=1 claude plugin test "$m" || exit 1; done'
  verify: 'go vet ./... && go test -race ./... && go build -trimpath ./cmd/vybava && for m in mods/*/; do claude plugin validate --strict "$m" && CLAUDE_CODE_ENABLE_FUNCTION_HOOKS=1 claude plugin test "$m" || exit 1; done'
