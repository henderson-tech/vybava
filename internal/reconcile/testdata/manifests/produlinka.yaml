# reconcile.yaml — produlinka-infra (PROD VPS 178.63.205.199 / 10.7.2.1).
# Port of scripts/infra-reconcile/map-paths.sh: mappings are ordered `case`
# arms, first match wins, `*` matches across `/` exactly like bash.
#
# V1 SCOPE (deliberately narrow — widen per-scope after the report-mode review):
#   nginx/*.conf        → /opt/nginx-proxy/conf.d/   (nginx.conf → /opt/nginx-proxy/)
#   scripts/**          → /opt/scripts/
#   apps/<app>/**       → /opt/apps/<app>/           (only if the live dir exists)
# Skipped on purpose: *.age + any .env (secrets — app-specific decrypt flows own
# them), *.md/docs/plans, apps/_shared (repo-side tooling), apps/fixit-dev
# (STALE remnant — live stack moved to Devulinka 2026-07), apps/eve-fixit-prod
# (its own health-gated reconciler), html/static/system/systemd/vpn (root-owned,
# sensitive — deliberate manual deploys), deployik's generated deployik-*.conf.
schema_version: 1
repo: lovinka-infra
host_label: lovinka-vps # prod hosts-registry label (eve monitor)
# clone defaults to this file's directory (/root/infra/lovinka-infra on the box)
mode_file: ~/.config/infra-reconcile/mode
state_dir: ~/.local/state/infra-reconcile
lock_file: /tmp/infra-reconcile.lock
apps_root: /opt/apps
# metrics_file: /opt/monitoring/textfile/infra-reconcile.prom
# vybava_version: v0.0.0  # pin the release the box installs

# Apps whose compose changes may auto-`docker compose up -d` after converge.
# Empty by default — every app is "converge file + ping to roll manually".
auto_roll_apps: []

mappings:
  # reservine-devlp: the three .env*.example files are the env CONTRACT the
  # dispatcher's env-put verb validates against on the box. They hold no
  # values and must converge; the live .env* files stay excluded by the next arm.
  - match:
      - apps/reservine-devlp/.env.example
      - apps/reservine-devlp/.env.fe.example
      - apps/reservine-devlp/.env.compose.example
    strip: apps/
    dest: /opt/apps/{rest}
    hook: compose
    require_live_dir: true
  - match: ["*.age", ".env*", "*/.env*", "*.md"]
    skip: true
  - match: ["apps/_shared/*"]
    skip: true
  - match: ["apps/fixit-dev/*"] # stale remnant — live fixit-dev is on Devulinka
    skip: true
  - match: ["apps/eve-fixit-prod/*"] # app-specific, health-gated reconciler
    skip: true
  - match: ["nginx/deployik-*.conf"] # deployik generates these on the box
    skip: true
  - match: [nginx/nginx.conf]
    dest: /opt/nginx-proxy/nginx.conf
    hook: nginx
  - match: ["nginx/*.conf"]
    strip: nginx/
    dest: /opt/nginx-proxy/conf.d/{rest}
    hook: nginx
  - match: ["scripts/infra-reconcile/*"] # the tool itself runs from the clone
    skip: true
  - match: ["scripts/*"]
    strip: scripts/
    dest: /opt/scripts/{rest}
    hook: none
  - match: ["apps/*/*"]
    strip: apps/
    dest: /opt/apps/{rest}
    hook: compose
    require_live_dir: true

# Bind-mounted DB config `docker compose up -d` does not apply: each converge
# prints its exact step instead of the generic ROLL MANUALLY. Same arms as
# map-paths.sh roll_note (roll-notes.sh pg_conf_note / pgbouncer_ini_note).
roll_notes:
  - match: [apps/fixit-prod/postgresql.conf]
    grammar: postgresql
    restart: "RESTART REQUIRED: fixit-prod postgres ({params}) — use /opt/scripts/pg-safe-restart.sh fixit-prod, never a bare `docker compose restart postgres`"
    reload: "RELOAD postgres: docker kill -s HUP fixit-prod-postgres"
  - match: [apps/fixit-prod/pg_hba.conf]
    grammar: raw
    reload: "RELOAD postgres: docker kill -s HUP fixit-prod-postgres"
  - match: [apps/fixit-prod/pgbouncer/pgbouncer.ini]
    grammar: pgbouncer
    restart: "RESTART REQUIRED: fixit-prod pgbouncer ({params}) — a RELOAD ignores these and a restart drops every client connection; plan it"
    reload: "RELOAD pgbouncer: docker kill -s HUP fixit-prod-pgbouncer"

# nginx runs in the proxy container on this box.
hooks:
  nginx:
    workdir: /opt/nginx-proxy
    test: [docker, compose, exec, -T, nginx, nginx, -t]
    reload: [docker, compose, exec, -T, nginx, nginx, -s, reload]
  compose: [docker, compose, up, -d]

alerts:
  - type: telegram
    lib: /opt/scripts/lib/telegram-notify.sh
    channel: lovinka_monitoring
  - type: eve-monitor
    config: ~/.config/infra-reconcile/eve-webhook

serve:
  listen: 10.7.2.1:9470
